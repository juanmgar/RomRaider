name: Build JavaFX Universal JAR

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: 17

    - name: Build project with Maven
      run: mvn -B clean package

    ######################################################
    # DESCARGA JAVAFX PARA 3 SISTEMAS (mirror fiable)
    ######################################################

    - name: Download JavaFX Windows x64
      run: |
        wget https://download2.gluonhq.com/openjfx/21.0.3/openjfx-21.0.3_windows-x64_bin-sdk.zip -O fx_win.zip
        unzip -o fx_win.zip -d fx_win

    - name: Download JavaFX Linux x64
      run: |
        wget https://download2.gluonhq.com/openjfx/21.0.3/openjfx-21.0.3_linux-x64_bin-sdk.zip -O fx_linux.zip
        unzip -o fx_linux.zip -d fx_linux

    - name: Download JavaFX MacOS aarch64
      run: |
        wget https://download2.gluonhq.com/openjfx/21.0.3/openjfx-21.0.3_osx-aarch64_bin-sdk.zip -O fx_mac.zip
        unzip -o fx_mac.zip -d fx_mac

    ######################################################
    # PREPARAR CARPETAS PARA CADA SISTEMA
    ######################################################

    - name: Prepare Windows ZIP
      run: |
        mkdir dist_windows
        cp target/rom-raider-1.0-SNAPSHOT.jar dist_windows/
        cp -r fx_win/javafx-sdk-21.0.3 dist_windows/javafx
        echo "java --module-path javafx/lib --add-modules javafx.controls,javafx.fxml,javafx.media -jar rom-raider-1.0-SNAPSHOT.jar" > dist_windows/run.bat
        cd dist_windows && zip -r ../romraider_windows.zip .

    - name: Prepare Linux ZIP
      run: |
        mkdir dist_linux
        cp target/rom-raider-1.0-SNAPSHOT.jar dist_linux/
        cp -r fx_linux/javafx-sdk-21.0.3 dist_linux/javafx
        echo "java --module-path javafx/lib --add-modules javafx.controls,javafx.fxml,javafx.media -jar rom-raider-1.0-SNAPSHOT.jar" > dist_linux/run.sh
        chmod +x dist_linux/run.sh
        cd dist_linux && zip -r ../romraider_linux.zip .

    - name: Prepare Mac ZIP
      run: |
        mkdir dist_mac
        cp target/rom-raider-1.0-SNAPSHOT.jar dist_mac/
        cp -r fx_mac/javafx-sdk-21.0.3 dist_mac/javafx
        echo "java --module-path javafx/lib --add-modules javafx.controls,javafx.fxml,javafx.media -jar rom-raider-1.0-SNAPSHOT.jar" > dist_mac/run.sh
        chmod +x dist_mac/run.sh
        cd dist_mac && zip -r ../romraider_mac.zip .

    ######################################################
    # SUBIR ARTIFACTOS
    ######################################################

    - name: Upload Windows artifact
      uses: actions/upload-artifact@v4
      with:
        name: romraider-windows
        path: romraider_windows.zip

    - name: Upload Linux artifact
      uses: actions/upload-artifact@v4
      with:
        name: romraider-linux
        path: romraider_linux.zip

    - name: Upload Mac artifact
      uses: actions/upload-artifact@v4
      with:
        name: romraider-mac
        path: romraider_mac.zip
