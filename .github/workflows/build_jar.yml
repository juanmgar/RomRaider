name: Build JavaFX Universal JAR

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: 17

    - name: Build project with Maven
      run: mvn -B clean package

    # DESCARGA Y PREPARA JAVAFX
    - name: Download JavaFX SDK
      run: |
        wget https://download2.gluonhq.com/openjfx/21.0.3/openjfx-21.0.3_linux-x64_bin-sdk.zip -O fx.zip
        unzip -o fx.zip
        mv javafx-sdk-21.0.3/lib javafx

    # SCRIPTS DE EJECUCIÓN WINDOWS
    - name: Create Windows run script
      run: |
        echo "java --module-path javafx --add-modules javafx.controls,javafx.fxml,javafx.media -jar rom-raider-1.0-SNAPSHOT.jar" > run.bat

    # SCRIPTS DE EJECUCIÓN LINUX/MAC
    - name: Create Linux/Mac run script
      run: |
        echo "java --module-path javafx --add-modules javafx.controls,javafx.fxml,javafx.media -jar rom-raider-1.0-SNAPSHOT.jar" > run.sh
        chmod +x run.sh

    # EMPAQUETAR TODO
    - name: Prepare release archive
      run: |
        mkdir release
        cp target/rom-raider-1.0-SNAPSHOT.jar release/
        cp -r javafx release/
        cp run.bat run.sh release/
        cd release && zip -r romraider.zip .

    # SUBIR ARTIFACTO
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: romraider-universal
        path: release/romraider.zip
