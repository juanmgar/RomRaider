name: Build JavaFX Universal JAR

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: 17

    - name: Build project with Maven
      run: mvn -B clean package

    ####################################
    # DESCARGA JAVAFX PARA 3 SISTEMAS
    ####################################

    - name: Download JavaFX (Windows)
      run: |
        wget https://download2.gluonhq.com/openjfx/21.0.3/openjfx-21.0.3_windows-x64_bin-sdk.zip -O fx_win.zip
        unzip -o fx_win.zip -d fx_win

    - name: Download JavaFX (Linux)
      run: |
        wget https://download2.gluonhq.com/openjfx/21.0.3/openjfx-21.0.3_linux-x64_bin-sdk.zip -O fx_linux.zip
        unzip -o fx_linux.zip -d fx_linux

    - name: Download JavaFX (MacOS)
      run: |
        wget https://download2.gluonhq.com/openjfx/21.0.3/openjfx-21.0.3_mac-aarch64_bin-sdk.zip -O fx_mac.zip
        unzip -o fx_mac.zip -d fx_mac

    ####################################
    # SCRIPTS DE EJECUCIÓN
    ####################################

    - name: Create universal run scripts
      run: |
        echo "java --module-path javafx/lib --add-modules javafx.controls,javafx.fxml,javafx.media -jar rom-raider-1.0-SNAPSHOT.jar" > run_windows.bat
        echo "java --module-path javafx/lib --add-modules javafx.controls,javafx.fxml,javafx.media -jar rom-raider-1.0-SNAPSHOT.jar" > run_linux.sh
        echo "java --module-path javafx/lib --add-modules javafx.controls,javafx.fxml,javafx.media -jar rom-raider-1.0-SNAPSHOT.jar" > run_mac.sh
        chmod +x run_linux.sh
        chmod +x run_mac.sh

    ####################################
    # ESTRUCTURA DE SALIDA FINAL
    ####################################
    - name: Prepare final package
      run: |
        mkdir dist
        cp target/rom-raider-1.0-SNAPSHOT.jar dist/

        mkdir dist/javafx-windows
        cp -r fx_win/javafx-sdk-21.0.3/* dist/javafx-windows/

        mkdir dist/javafx-linux
        cp -r fx_linux/javafx-sdk-21.0.3/* dist/javafx-linux/

        mkdir dist/javafx-mac
        cp -r fx_mac/javafx-sdk-21.0.3/* dist/javafx-mac/

        cp run_windows.bat dist/
        cp run_linux.sh dist/
        cp run_mac.sh dist/

        cd dist && zip -r romraider_universal.zip .

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: romraider-universal
        path: dist/romraider_universal.zip
