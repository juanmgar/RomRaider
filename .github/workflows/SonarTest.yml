name: SonarCloud Analysis

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

env:
  RAWG_API_KEY: ${{ secrets.RAWG_API_KEY }}
  SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
  SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}

jobs:
  sonar:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # IMPORTANTE para SonarCloud (historial de git completo)
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      ###################################################################
      # GENERAR secrets.properties **ANTES** DE LOS TESTS
      ###################################################################
      - name: Inject secrets.properties into resources folder
        run: |
          mkdir -p src/main/resources/config
          echo "SUPABASE_URL=${SUPABASE_URL}" > src/main/resources/config/secrets.properties
          echo "SUPABASE_KEY=${SUPABASE_KEY}" >> src/main/resources/config/secrets.properties
          echo "RAWG_API_KEY=${RAWG_API_KEY}" >> src/main/resources/config/secrets.properties

      ###################################################################
      # BUILD + TESTS + REPORT JACOCO + SONAR
      ###################################################################
      - name: Build, test and analyze with SonarCloud
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}   # lo pone GitHub por defecto
          SONAR_TOKEN:  ${{ secrets.SONAR_TOKEN }}    # lo creas en SonarCloud
        run: |
          mvn -B verify sonar:sonar -Dsonar.token=${{ secrets.SONAR_TOKEN }}

